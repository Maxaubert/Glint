[package]
name = "glint-editor"
description = "The Glint editor: annotate, crop, copy and save a capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "glint_editor"
path = "src/lib.rs"

[[bin]]
name = "glint-editor"
path = "src/main.rs"

[dependencies]
glint-core.workspace = true
windows.workspace = true
tiny-skia = "0.11"
ab_glyph = "0.2"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
rfd = "0.17"
serde.workspace = true
toml.workspace = true

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[lints]
workspace = true
