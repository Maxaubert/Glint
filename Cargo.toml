[workspace]
resolver = "2"
members = ["crates/glint-core", "crates/glint-capture", "crates/glint", "crates/glint-editor"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
glint-core = { path = "crates/glint-core" }
glint-capture = { path = "crates/glint-capture" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Devices_Display",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_WinRT_Direct3D11",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
# Pixel loops read better with chunks_exact(4) and index loops over channels.
chunks_exact_to_as_chunks = "allow"
needless_range_loop = "allow"
field_reassign_with_default = "allow"
