<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glint editor: 10 looks</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Permanent+Marker&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&family=Silkscreen&family=Barlow+Condensed:wght@500;600;700&family=Mukta:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root { --page: #101012; --ink: #e8e8ee; --dim: #8a8a96; }
* { box-sizing: border-box; }
html { background: var(--page); color: var(--ink); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
body { margin: 0; padding: 40px 32px 120px; }
::selection { background: #8b5cf6; color: #fff; }
header.page { max-width: 1180px; margin: 0 auto 28px; }
header.page h1 { font: 700 30px/1.15 "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 0 0 8px; letter-spacing: -0.01em; }
header.page p { margin: 0; color: var(--dim); max-width: 70ch; }
nav.jump { position: sticky; top: 0; z-index: 50; display: flex; gap: 6px; flex-wrap: wrap; max-width: 1180px; margin: 0 auto 28px; padding: 10px 0; background: linear-gradient(var(--page) 70%, transparent); }
nav.jump a { color: var(--ink); text-decoration: none; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid #2c2c33; background: #18181c; }
nav.jump a:hover { border-color: #8b5cf6; }
nav.jump a:focus-visible { outline: 2px solid #8b5cf6; outline-offset: 2px; }

section.look { max-width: 1180px; margin: 0 auto 72px; display: grid; grid-template-columns: 1fr 300px; gap: 28px; align-items: start; scroll-margin-top: 70px; }
@media (max-width: 1100px) { section.look { grid-template-columns: 1fr; } }
.about h2 { margin: 6px 0 6px; font: 700 22px/1.2 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.about .num { font: 600 13px/1 "Segoe UI", sans-serif; color: var(--dim); }
.about p { margin: 0 0 10px; color: #c4c4cc; font-size: 14px; }
.about dl { margin: 14px 0 0; font-size: 13px; }
.about dt { color: var(--dim); margin-top: 8px; }
.about dd { margin: 2px 0 0; color: #d8d8de; }
.about .try { margin-top: 16px; font-size: 13px; color: #a99bff; }
.about .lead { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #2a2340; color: #c9bcff; margin-left: 6px; vertical-align: 2px; }

/* ---------- shared editor skeleton (each look restyles it) ---------- */
.win { position: relative; border-radius: var(--win-r, 8px); overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font); box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.4); border: 1px solid var(--edge); }
.titlebar { height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 0 0 12px; background: var(--title-bg, var(--bar)); color: var(--title-fg, var(--fg)); font-size: 12px; }
.titlebar .appicon { width: 16px; height: 16px; border-radius: 4px; background: var(--accent); flex: none; }
.titlebar .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .size { color: var(--dim-fg); }
.titlebar .caps { margin-left: auto; display: flex; height: 100%; }
.titlebar .caps span { width: 44px; display: grid; place-items: center; color: var(--dim-fg); }
.titlebar .caps svg { width: 10px; height: 10px; }
.toolbar { display: flex; align-items: center; gap: 2px; padding: 8px 10px; background: var(--bar); border-bottom: 1px solid var(--rule, transparent); }
.tool { width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--btn-r, 6px); border: 0; background: transparent; color: var(--fg); cursor: pointer; position: relative; }
.tool:hover { background: var(--hover); }
.tool.on { background: var(--sel-bg, var(--accent)); color: var(--sel-fg, #fff); }
.tool:focus-visible, .act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tool svg, .act svg { width: 18px; height: 18px; }
.sep { width: 1px; height: 22px; background: var(--rule-v, #ffffff20); margin: 0 8px; }
.sw { width: 24px; height: 34px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; padding: 0; }
.sw i { width: 18px; height: 18px; border-radius: var(--sw-r, 50%); background: var(--c); box-shadow: inset 0 0 0 1px #ffffff30; }
.sw.on i { box-shadow: 0 0 0 2px var(--bar), 0 0 0 4px var(--fg); }
.dot { width: 28px; display: grid; place-items: center; }
.dot i { width: 11px; height: 11px; border-radius: 50%; background: #ff3b30; }
.grow { flex: 1; }
.act { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 13px 0 11px; border-radius: var(--btn-r, 6px); border: 0; cursor: pointer; font: var(--btn-font, 600 13px var(--font)); color: var(--fg); background: transparent; position: relative; }
.act.copy { background: var(--copy-bg, transparent); color: var(--copy-fg, var(--fg)); margin-right: 4px; }
.act.copy:hover { background: var(--copy-hover, var(--hover)); }
.act.save { background: var(--accent); color: var(--accent-fg, #fff); }
.act .ic { position: relative; width: 18px; height: 18px; display: grid; place-items: center; }
.act .ic svg { position: absolute; }
.canvas { position: relative; height: 380px; background: var(--canvas); display: grid; place-items: center; overflow: hidden; }
.shot { position: relative; width: 560px; max-width: 86%; aspect-ratio: 16/9; box-shadow: var(--shot-shadow, 0 6px 24px rgba(0,0,0,.45)); border-radius: var(--shot-r, 2px); overflow: hidden; }
.shot > svg { display: block; width: 100%; height: 100%; }
.marks { position: absolute; inset: 0; pointer-events: none; }
.toast-msg { position: absolute; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ======================= 1. Light table (lead) ======================= */
.t1 { --font: "Manrope", sans-serif; --bg: #0e0f11; --bar: #16181b; --fg: #eef0f2; --dim-fg: #8b9097; --edge: #23262b; --hover: #ffffff10; --accent: #f2f4f6; --accent-fg: #0e0f11; --sel-bg: #f2f4f6; --sel-fg: #0e0f11; --canvas: radial-gradient(ellipse at 50% 45%, #f4f1e8 0%, #e9e4d6 55%, #cfc8b4 100%); --rule: #23262b; --win-r: 10px; --btn-r: 8px; --shot-shadow: 0 2px 0 #fff8, 0 14px 30px rgba(60,48,20,.35); --copy-bg: #24272c; }
.t1 .titlebar .appicon { background: #f2f4f6; }
.t1 .canvas::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(90deg, transparent 0 79px, #0000000c 79px 80px), repeating-linear-gradient(0deg, transparent 0 79px, #0000000c 79px 80px); }
.t1 .shot { z-index: 1; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
.t1.copied .shot { transform: translateY(-6px) scale(.985); box-shadow: 0 2px 0 #fff8, 0 26px 40px rgba(60,48,20,.4); }
.t1 .fly { position: absolute; z-index: 30; border-radius: 3px; background-size: cover; box-shadow: 0 8px 20px rgba(0,0,0,.5); transition: all .55s cubic-bezier(.6,0,.2,1); }
.t1 .act.copy .lbl { transition: opacity .2s; }
.t1.copied .act.copy { background: #f2f4f6; color: #0e0f11; }
.t1 .act.copy .chk { opacity: 0; transform: scale(.4); transition: all .3s cubic-bezier(.3,1.6,.5,1) .35s; }
.t1.copied .act.copy .chk { opacity: 1; transform: none; }
.t1.copied .act.copy .cpy { opacity: 0; transition: opacity .15s .3s; }

/* ======================= 2. Fluent / Mica (pick) ======================= */
.t2 { --font: "Segoe UI Variable Text", "Segoe UI", sans-serif; --bg: #202020; --bar: #2b2b2b; --title-bg: #202020; --fg: #ffffff; --dim-fg: #a8a8a8; --edge: #3a3a3a; --hover: #ffffff0f; --accent: #8b5cf6; --canvas: #1c1c1c; --rule: #ffffff0d; --win-r: 8px; --btn-r: 5px; --copy-bg: #ffffff0f; }
.t2 .toolbar { margin: 0 8px 8px; border-radius: 8px; border: 1px solid #ffffff0d; }
.t2 .tool.on::after { content: ""; position: absolute; bottom: 3px; left: 12px; right: 12px; height: 3px; border-radius: 2px; background: #c4b0ff; }
.t2 .tool.on { background: #ffffff14; color: #fff; }
.t2 .act.copy { overflow: hidden; transition: background .25s; }
.t2 .act.copy .chk path { stroke-dasharray: 24; stroke-dashoffset: 24; }
.t2.copied .act.copy { background: #8b5cf6; color: #fff; }
.t2.copied .act.copy .cpy { opacity: 0; transform: scale(.6); transition: all .16s; }
.t2.copied .act.copy .chk path { stroke-dashoffset: 0; transition: stroke-dashoffset .35s cubic-bezier(.65,0,.35,1) .1s; }
.t2 .act.copy .ripple { position: absolute; border-radius: 50%; background: #ffffff40; transform: scale(0); animation: t2r .6s ease-out forwards; pointer-events: none; }
@keyframes t2r { to { transform: scale(4); opacity: 0; } }

/* ======================= 3. Contact sheet ======================= */
.t3 { --font: "Courier Prime", monospace; --bg: #111; --bar: #161616; --fg: #f1efe9; --dim-fg: #9b978d; --edge: #262626; --hover: #ffffff12; --accent: #e8322b; --sel-bg: #e8322b; --canvas: #0b0b0b; --win-r: 4px; --btn-r: 3px; --copy-bg: #1f1f1f; --btn-font: 700 13px "Courier Prime", monospace; --shot-r: 0; }
.t3 .toolbar { border-bottom: 1px dashed #3a3a3a; }
.t3 .canvas { background: #0b0b0b; }
.t3 .filmedge { position: absolute; left: 0; right: 0; height: 26px; display: flex; gap: 16px; align-items: center; padding: 0 14px; color: #c7a24a; font: 700 11px "Courier Prime", monospace; letter-spacing: .12em; }
.t3 .filmedge.top { top: 10px; } .t3 .filmedge.bot { bottom: 10px; }
.t3 .filmedge b { width: 12px; height: 8px; border-radius: 2px; background: #2a2a2a; }
.t3 .pencil { position: absolute; left: -12px; top: -9px; width: calc(100% + 24px); height: calc(100% + 18px); pointer-events: none; overflow: visible; }
.t3 .pencil path { fill: none; stroke: #e8322b; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 260; stroke-dashoffset: 260; opacity: .95; }
.t3.copied .pencil path.ring { stroke-dashoffset: 0; transition: stroke-dashoffset .5s cubic-bezier(.5,0,.3,1); }
.t3.copied .pencil path.tick { stroke-dashoffset: 0; transition: stroke-dashoffset .25s ease-out .45s; }
.t3 .pencil path.tick { stroke-dasharray: 40; stroke-dashoffset: 40; }
.t3 .note { position: absolute; right: 12px; top: 54px; font: 26px "Permanent Marker", cursive; color: #e8322b; transform: rotate(-6deg); opacity: 0; transition: opacity .2s .6s; }
.t3.copied .note { opacity: 1; }

/* ======================= 4. Instant print ======================= */
.t4 { --font: "Hanken Grotesk", sans-serif; --bg: #1b1a18; --bar: #24221f; --fg: #f3efe7; --dim-fg: #a59d90; --edge: #33302b; --hover: #ffffff12; --accent: #ff6b3d; --accent-fg: #1b1a18; --sel-bg: #f3efe7; --sel-fg: #1b1a18; --canvas: #141311; --win-r: 12px; --btn-r: 9px; --copy-bg: #33302b; }
.t4 .sw i { border-radius: 4px; }
.t4 .print { position: absolute; z-index: 40; width: 120px; padding: 7px 7px 26px; background: #fbf8f1; border-radius: 2px; box-shadow: 0 10px 24px rgba(0,0,0,.5); transform-origin: top center; }
.t4 .print .ph { aspect-ratio: 16/9; background: #222 center/cover; filter: brightness(.15) saturate(0) blur(2px); transition: filter 1.6s ease-out .5s; }
.t4 .print.dev .ph { filter: none; }
.t4 .print .cap { position: absolute; left: 8px; right: 8px; bottom: 5px; font: 600 15px "Caveat", cursive; color: #2d2a26; text-align: center; }
.t4.copied .act.copy { background: #f3efe7; color: #1b1a18; }

/* ======================= 5. Riso two-ink ======================= */
.t5 { --font: "Bricolage Grotesque", sans-serif; --bg: #f2efe6; --bar: #f2efe6; --fg: #1e2a5a; --dim-fg: #6a6f8a; --edge: #d8d2c2; --hover: #1e2a5a12; --accent: #ff4f8b; --accent-fg: #fff; --sel-bg: #1e2a5a; --sel-fg: #f2efe6; --canvas: #e6e1d3; --rule: #d8d2c2; --win-r: 6px; --btn-r: 4px; --rule-v: #1e2a5a30; --copy-bg: #fff; --title-bg: #ff4f8b; --title-fg: #fff; --btn-font: 800 14px "Bricolage Grotesque", sans-serif; }
.t5 .titlebar .size, .t5 .titlebar .caps span { color: #ffffffcc; }
.t5 .titlebar .appicon { background: #1e2a5a; }
.t5 .canvas { background-image: radial-gradient(#1e2a5a1a 1px, transparent 1.2px); background-size: 7px 7px; }
.t5 .act.copy { border: 2px solid #1e2a5a; }
.t5 .riso { position: relative; display: inline-block; }
.t5 .riso b { position: absolute; inset: 0; font: inherit; }
.t5 .riso .p { color: #ff4f8b; mix-blend-mode: multiply; }
.t5 .riso .b { color: #1e2a5a; mix-blend-mode: multiply; }
.t5.copied .riso .p { animation: t5p .55s cubic-bezier(.2,.9,.2,1); }
.t5.copied .riso .b { animation: t5b .55s cubic-bezier(.2,.9,.2,1); }
@keyframes t5p { 0% { transform: translate(-7px,-4px); } 100% { transform: none; } }
@keyframes t5b { 0% { transform: translate(6px,4px); } 100% { transform: none; } }
.t5.copied .act.copy { background: #ffe14d; }

/* ======================= 6. Swiss rule ======================= */
.t6 { --font: "Hanken Grotesk", sans-serif; --bg: #0f0f10; --bar: #0f0f10; --fg: #f5f5f5; --dim-fg: #8d8d92; --edge: #232326; --hover: #ffffff10; --accent: #ff3b1f; --sel-bg: transparent; --sel-fg: #ff3b1f; --canvas: #18181a; --rule: #f5f5f5; --win-r: 0; --btn-r: 0; --copy-bg: transparent; --btn-font: 500 13px "Hanken Grotesk", sans-serif; --shot-shadow: none; }
.t6 .toolbar { border-bottom: 1px solid #f5f5f5; padding: 8px 14px; }
.t6 .tool.on { box-shadow: inset 0 -2px 0 #ff3b1f; }
.t6 .sw i { border-radius: 0; width: 16px; height: 16px; }
.t6 .act.copy { border: 1px solid #f5f5f5; overflow: hidden; }
.t6 .act.save { background: #ff3b1f; }
.t6 .act .lblwrap { height: 18px; width: 60px; overflow: hidden; display: inline-block; }
.t6 .act .lblwrap span { display: block; transition: transform .4s cubic-bezier(.7,0,.2,1); }
.t6.copied .act .lblwrap span { transform: translateY(-18px); }
.t6 .act.copy .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: #ff3b1f; }
.t6.copied .act.copy .bar { width: 100%; transition: width .35s cubic-bezier(.7,0,.2,1); }

/* ======================= 7. Bitmap specimen (challenger) ======================= */
.t7 { --font: "Hanken Grotesk", sans-serif; --bg: #f4f4f0; --bar: #f4f4f0; --fg: #111; --dim-fg: #6d6d68; --edge: #111; --hover: #11111112; --accent: #2f5bff; --sel-bg: #111; --sel-fg: #f4f4f0; --canvas: #e9e9e3; --rule: #111; --win-r: 0; --btn-r: 0; --rule-v: #111; --copy-bg: #fff; --btn-font: 400 13px "Silkscreen", monospace; --title-bg: #111; --title-fg: #f4f4f0; --shot-shadow: 6px 6px 0 #111; }
.t7 .titlebar { font-family: "Silkscreen", monospace; font-size: 11px; }
.t7 .act { border: 2px solid #111; }
.t7 .act.save { background: #2f5bff; color: #fff; }
.t7 .pix { display: grid; grid-template-columns: repeat(8, 2px); grid-auto-rows: 2px; gap: 0; }
.t7 .pix i { background: transparent; }
.t7 .pix i.on { background: currentColor; }

/* ======================= 8. Ticket wallet (challenger) ======================= */
.t8 { --font: "Barlow Condensed", sans-serif; --bg: #f7f5ef; --bar: #f7f5ef; --fg: #14254f; --dim-fg: #5b6684; --edge: #c9c3b3; --hover: #14254f12; --accent: #c8202f; --sel-bg: #14254f; --sel-fg: #f7f5ef; --canvas: #ebe7dc; --rule: #14254f; --win-r: 6px; --btn-r: 3px; --rule-v: #14254f40; --copy-bg: #fff; --btn-font: 700 15px "Barlow Condensed", sans-serif; --title-bg: #14254f; --title-fg: #f7f5ef; }
.t8 .toolbar { border-bottom: 2px solid #14254f; }
.t8 .act { letter-spacing: .06em; text-transform: uppercase; }
.t8 .act.copy { border: 1.5px solid #14254f; border-right-style: dashed; }
.t8 .stub { position: absolute; z-index: 40; padding: 6px 12px 6px 14px; background: #fff; border: 1.5px solid #14254f; border-left: 2px dashed #14254f; font: 700 13px "Barlow Condensed", sans-serif; color: #14254f; letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 6px 16px rgba(20,37,79,.25); }
.t8 .stub .stamp { display: inline-block; margin-left: 8px; padding: 0 6px; border: 2px solid #c8202f; color: #c8202f; transform: rotate(-8deg) scale(2); opacity: 0; transition: all .25s cubic-bezier(.3,1.5,.5,1) .35s; }
.t8 .stub.hit .stamp { transform: rotate(-8deg) scale(1); opacity: 1; }

/* ======================= 9. Concourse yellow (challenger) ======================= */
.t9 { --font: "Mukta", sans-serif; --bg: #141414; --bar: #ffd100; --fg: #111; --dim-fg: #3c3c3c; --edge: #2a2a2a; --hover: #00000014; --accent: #111; --accent-fg: #ffd100; --sel-bg: #111; --sel-fg: #ffd100; --canvas: #1d1d1d; --win-r: 4px; --btn-r: 3px; --rule-v: #00000040; --copy-bg: #111; --copy-fg: #ffd100; --copy-hover: #262626; --title-bg: #141414; --title-fg: #eee; --btn-font: 700 14px "Mukta", sans-serif; }
.t9 .titlebar .size { color: #ffd100; }
.t9 .titlebar .caps span { color: #aaa; }
.t9 .flap { display: inline-flex; gap: 2px; }
.t9 .flap span { position: relative; width: 11px; height: 20px; display: grid; place-items: center; background: #222; color: #ffd100; border-radius: 2px; font: 700 13px "Mukta", sans-serif; overflow: hidden; }
.t9 .flap span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #000; }
.t9 .flap span.flip { animation: t9f .09s linear 3; }
@keyframes t9f { 50% { transform: scaleY(.1); } }
.t9 .act.copy .ic { color: #ffd100; }

/* ======================= 10. Exposure record (challenger) ======================= */
.t10 { --font: "Barlow Condensed", sans-serif; --bg: #121212; --bar: #1a1a1a; --fg: #e4e4e4; --dim-fg: #8f8f8f; --edge: #2b2b2b; --hover: #ffffff10; --accent: #e0389a; --sel-bg: #e4e4e4; --sel-fg: #121212; --canvas: #0d0d0d; --win-r: 2px; --btn-r: 2px; --copy-bg: #222; --btn-font: 600 15px "Barlow Condensed", sans-serif; }
.t10 .act { letter-spacing: .08em; text-transform: uppercase; }
.t10 .zone { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; display: flex; }
.t10 .zone i { flex: 1; opacity: 0; }
.t10.copied .zone i { opacity: 1; transition: opacity .05s; }
.t10 .delta { position: absolute; top: -26px; right: 0; font: 600 12px "JetBrains Mono", monospace; color: #e0389a; opacity: 0; transform: translateY(6px); transition: all .3s .5s; white-space: nowrap; }
.t10.copied .delta { opacity: 1; transform: none; }
.t10 .safelight { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 0 #e0389a00; transition: box-shadow .5s; }
.t10.copied .safelight { box-shadow: inset 0 0 120px 0 #e0389a40; }
.t10 .ramp { position: absolute; left: 14px; top: 14px; display: flex; border: 1px solid #333; }
.t10 .ramp i { width: 14px; height: 10px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
</style>
</head>
<body>
<header class="page">
  <h1>Glint editor: 10 looks</h1>
  <p>Each window works the same way: tools, colours, size, undo, Copy, Save. Only the look and the Copy animation change. Click <strong>Copy</strong> (or a window and press Ctrl+C) to play it. The screenshot inside is made-up sample content.</p>
</header>
<nav class="jump" aria-label="Looks"></nav>
<main id="looks"></main>

<script>
const ICON = {
  select: '<path d="M6 3.5l12.5 7.2-5.6 1.6-2.6 5.4z"/>',
  arrow: '<path d="M5 19L18.5 5.5M10 5h9v9"/>',
  rect: '<rect x="4" y="6" width="16" height="12" rx="1.5"/>',
  ellipse: '<ellipse cx="12" cy="12" rx="8.5" ry="6.2"/>',
  highlight: '<path d="M14.5 4.5l5 5-7.5 7.5H7v-5zM4 21h9"/>',
  pen: '<path d="M4.5 19.5l1-4.2L16 4.8a2 2 0 012.9 0l.3.3a2 2 0 010 2.9L8.7 18.5z"/>',
  text: '<path d="M5 7V5h14v2M12 5v14M9 19h6"/>',
  step: '<circle cx="12" cy="12" r="8"/><path d="M10.5 9.2L12.6 8v8"/>',
  blur: '<rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4.5 13.5l9-9M8 19.5l11.5-11.5M14.5 19.8l5.3-5.3"/>',
  crop: '<path d="M7 3v14h14M3 7h14v14"/>',
  undo: '<path d="M9 14L4.5 9.5 9 5M5 9.5h9.5a5 5 0 010 10H11"/>',

function copyLabel(L) {

// ---------- copy animations ----------
const timers = new WeakMap();
function settle(win, ms) { clearTimeout(timers.get(win)); timers.set(win, setTimeout(() => reset(win), ms)); }
function reset(win) {
  win.classList.remove('copied');
  win.querySelectorAll('.print,.stub,.fly,.ripple').forEach(e => e.remove());
  const btn = win.querySelector('.act.copy');
  const lbl = btn.querySelector('.lbl'); if (lbl) lbl.textContent = 'Copy';
  if (win.classList.contains('t5')) btn.querySelectorAll('.riso b').forEach(b => b.textContent = 'COPY');
  if (win.classList.contains('t9')) setFlap(btn, 'COPY');
  if (win.classList.contains('t7')) { btn.querySelector('.pix').innerHTML = ''; btn.querySelector('.cpy').style.opacity = 1; }
}
function rel(win, el) { const a = win.getBoundingClientRect(), b = el.getBoundingClientRect(); return { x: b.left - a.left, y: b.top - a.top, w: b.width, h: b.height }; }
function setFlap(btn, word, animate) {
  const tiles = btn.querySelectorAll('.flap span');
  const chars = word.padEnd(tiles.length, ' ').split('');
  tiles.forEach((t, i) => {
    if (!animate) { t.textContent = chars[i].trim(); return; }
    setTimeout(() => { t.classList.remove('flip'); void t.offsetWidth; t.classList.add('flip'); setTimeout(() => t.textContent = chars[i].trim(), 140); }, i * 70);
  });
}
const PIX = ['........','.......#','......##','#....##.','##..##..','.####...','..##....','........'];

const PLAY = {
  t1(win, btn) {
    const shot = win.querySelector('.shot'), s = rel(win, shot), b = rel(win, btn);
    const f = document.createElement('div'); f.className = 'fly';
    Object.assign(f.style, { left: s.x + 'px', top: s.y + 'px', width: s.w + 'px', height: s.h + 'px', backgroundImage: `url("${SHOT_URI}")`, opacity: .95 });
    win.appendChild(f); win.classList.add('copied');
    requestAnimationFrame(() => requestAnimationFrame(() => Object.assign(f.style, { left: b.x + 6 + 'px', top: b.y + 8 + 'px', width: '22px', height: '13px', opacity: 0 })));
    btn.querySelector('.lbl').textContent = 'Copied';
    settle(win, 1800);
  },
  t2(win, btn, ev) {
    const r = btn.getBoundingClientRect(), d = Math.max(r.width, r.height);
    const rp = document.createElement('span'); rp.className = 'ripple';
    const x = (ev && ev.clientX ? ev.clientX - r.left : r.width / 2), y = (ev && ev.clientY ? ev.clientY - r.top : r.height / 2);
    Object.assign(rp.style, { width: d + 'px', height: d + 'px', left: x - d / 2 + 'px', top: y - d / 2 + 'px' });
    btn.appendChild(rp); win.classList.add('copied'); btn.querySelector('.lbl').textContent = 'Copied';
    settle(win, 1600);
  },
  t3(win, btn) { win.classList.add('copied'); settle(win, 2000); },
  t4(win, btn) {
    const b = rel(win, btn);
    const p = document.createElement('div'); p.className = 'print';
    p.innerHTML = `<div class="ph" style="background-image:url('${SHOT_URI}')"></div><div class="cap">copied!</div>`;
    Object.assign(p.style, { left: b.x + b.w / 2 - 60 + 'px', top: b.y + b.h - 4 + 'px', transform: 'translateY(-70px) scaleY(.2)', opacity: 0, transition: 'transform .6s cubic-bezier(.2,.9,.25,1.15), opacity .2s' });
    win.appendChild(p); win.classList.add('copied'); btn.querySelector('.lbl').textContent = 'Copied';
    requestAnimationFrame(() => requestAnimationFrame(() => { p.style.transform = 'translateY(10px) rotate(-3deg)'; p.style.opacity = 1; p.classList.add('dev'); }));
    settle(win, 2600);
  },
  t5(win, btn) {
    btn.querySelectorAll('.riso b').forEach(b => b.textContent = 'COPIED');
    win.classList.remove('copied'); void win.offsetWidth; win.classList.add('copied'); settle(win, 1700);
  },
  t6(win) { win.classList.add('copied'); settle(win, 1700); },
  t7(win, btn) {
    const g = btn.querySelector('.pix'); g.innerHTML = ''; btn.querySelector('.cpy').style.opacity = 0;
    const on = []; PIX.forEach(row => row.split('').forEach(c => { const i = document.createElement('i'); g.appendChild(i); if (c === '#') on.push(i); }));
    on.forEach((i, k) => setTimeout(() => i.classList.add('on'), 40 + k * 28));
    btn.querySelector('.lbl').textContent = 'Copied'; win.classList.add('copied'); settle(win, 1900);
  },
  t8(win, btn) {
    const b = rel(win, btn);
    const s = document.createElement('div'); s.className = 'stub'; s.innerHTML = `Coupon 1 of 1<span class="stamp">Copied</span>`;
    Object.assign(s.style, { left: b.x + b.w - 30 + 'px', top: b.y + b.h + 6 + 'px', transform: 'translate(-30px,-14px) rotate(0)', opacity: 0, transition: 'transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .15s' });
    win.appendChild(s); win.classList.add('copied');
    requestAnimationFrame(() => requestAnimationFrame(() => { s.style.transform = 'translate(-60px,4px) rotate(4deg)'; s.style.opacity = 1; s.classList.add('hit'); }));
    settle(win, 2200);
  },
  t9(win, btn) { setFlap(btn, 'COPIED', true); win.classList.add('copied'); settle(win, 1900); },
  t10(win, btn) { win.classList.remove('copied'); void win.offsetWidth; win.classList.add('copied'); btn.querySelector('.lbl').textContent = 'Copied'; settle(win, 2100); },
};

document.querySelectorAll('.win').forEach(win => {
  const btn = win.querySelector('.act.copy');
  const kind = [...win.classList].find(c => PLAY[c]);
  const go = (ev) => { reset(win); requestAnimationFrame(() => PLAY[kind](win, btn, ev)); };
  btn.addEventListener('click', go);
  win.addEventListener('keydown', e => { if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) { e.preventDefault(); go(); } });
  win.querySelectorAll('.tool').forEach(t => t.addEventListener('click', () => {
    if (!TOOLS.some(([, n]) => t.getAttribute('aria-label') === n)) return;
    win.querySelectorAll('.tool.on').forEach(o => o.classList.remove('on')); t.classList.add('on');
  }));
  win.querySelectorAll('.sw').forEach(s => s.addEventListener('click', () => {
    win.querySelectorAll('.sw.on').forEach(o => o.classList.remove('on')); s.classList.add('on');
    win.querySelector('.dot i').style.background = s.style.getPropertyValue('--c');
  }));
});
