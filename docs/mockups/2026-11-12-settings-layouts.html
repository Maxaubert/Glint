<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Glint settings: 10 layouts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root, [data-theme="dark"] {
  --page: #0b0b0e; --ink: #ececf1; --dim: #8e8e9a;
  --bg: #111114; --panel: #1f1f25; --panel2: #26262d; --edge: #ffffff17; --hover: #ffffff12; --fg: #ececf1; --fg2: #9a9aa6;
  --accent: #8b5cf6; --accent-soft: #8b5cf62e; --shadow: #000000a0; --track: #ffffff26; --field: #ffffff0d; --scrim: #00000080;
}
[data-theme="light"] {
  --page: #f4f4f7; --ink: #1b1b1f; --dim: #6b6b78;
  --bg: #e9e9ee; --panel: #fbfbfd; --panel2: #f1f1f5; --edge: #0000001a; --hover: #0000000d; --fg: #1b1b1f; --fg2: #6b6b78;
  --accent: #8b5cf6; --accent-soft: #8b5cf624; --shadow: #00000033; --track: #0000002b; --field: #0000000a; --scrim: #00000040;
}
* { box-sizing: border-box; }
html { background: var(--page); color: var(--ink); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; transition: background .2s, color .2s; }
body { margin: 0; padding: 36px 32px 120px; }
::selection { background: var(--accent); color: #fff; }
header.page { max-width: 1240px; margin: 0 auto 20px; display: flex; gap: 24px; align-items: end; flex-wrap: wrap; }
header.page h1 { font: 700 30px/1.15 "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 0 0 6px; }
header.page p { margin: 0; color: var(--dim); max-width: 70ch; }
.themes { margin-left: auto; display: flex; background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; padding: 3px; }
.themes button { border: 0; background: none; color: var(--fg2); font: 600 13px inherit; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.themes button.on { background: var(--accent); color: #fff; }
nav.jump { position: sticky; top: 0; z-index: 50; display: flex; gap: 6px; flex-wrap: wrap; max-width: 1240px; margin: 0 auto 26px; padding: 10px 0; background: linear-gradient(var(--page) 70%, transparent); }
nav.jump a { color: var(--ink); text-decoration: none; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--edge); background: var(--panel); }
section.look { max-width: 1240px; margin: 0 auto 70px; display: grid; grid-template-columns: 1fr 280px; gap: 28px; align-items: start; scroll-margin-top: 70px; }
@media (max-width: 1150px) { section.look { grid-template-columns: 1fr; } }
.about .num { font-size: 13px; color: var(--dim); }
.about h2 { margin: 4px 0 8px; font: 700 22px/1.2 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.about ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink); opacity: .85; }
.about li { margin-bottom: 5px; }

/* the editor behind */
.win { position: relative; height: 560px; border-radius: 8px; overflow: hidden; background: var(--bg); color: var(--fg); border: 1px solid var(--edge); box-shadow: 0 18px 50px #0000007a; font-family: inherit; }
.win .tbar { height: 32px; display: flex; align-items: center; gap: 8px; padding-left: 12px; font-size: 12px; color: var(--fg2); }
.win .tbar i { width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg, #a78bfa, #7c3aed); }
.win .shot { position: absolute; left: 50%; top: 52%; width: 520px; aspect-ratio: 16/9; transform: translate(-50%, -50%); background: #fff; border-radius: 2px; box-shadow: 0 6px 24px #0000004d; overflow: hidden; }
.win .shot::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 26px; background: #f3f4f6; }
.win .shot b { position: absolute; left: 24px; right: 24px; height: 28px; border-radius: 5px; background: #f6f7f9; border: 1px solid #e5e7eb; }
.win .pills { position: absolute; right: 14px; top: 44px; display: flex; gap: 6px; }
.pill { height: 34px; border-radius: 17px; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; background: var(--panel); border: 1px solid var(--edge); color: var(--fg); }
.pill.save { background: var(--accent); color: #fff; border-color: transparent; }
.pill.gear { width: 34px; padding: 0; justify-content: center; }
.pill.gear.on { background: var(--accent); color: #fff; border-color: transparent; }
.pill svg { width: 16px; height: 16px; }
.win .dock { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); height: 46px; width: 560px; border-radius: 15px; background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 8px 24px var(--shadow); display: flex; align-items: center; gap: 12px; padding: 0 14px; }
.win .dock span { width: 18px; height: 18px; border-radius: 5px; background: var(--fg2); opacity: .5; }
.win .dock span.c { border-radius: 50%; opacity: 1; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }

/* controls */
.sheet { background: var(--panel); color: var(--fg); border: 1px solid var(--edge); box-shadow: 0 20px 50px var(--shadow); }
.h { font-weight: 700; font-size: 15px; }
.cap { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg2); }
.set { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.set .t { flex: 1; min-width: 0; }
.set .t b { display: block; font-weight: 600; font-size: 13.5px; }
.set .t small { display: block; color: var(--fg2); font-size: 12px; line-height: 1.35; }
.set .ico { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.set .ico svg { width: 16px; height: 16px; }
.tg { width: 40px; height: 22px; border-radius: 11px; background: var(--track); position: relative; border: 0; cursor: pointer; flex: none; transition: background .2s; padding: 0; }
.tg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0006; transition: transform .22s cubic-bezier(.3,1.4,.5,1); }
.tg.on { background: var(--accent); }
.tg.on::after { transform: translateX(18px); }
.tg:focus-visible, .hk:focus-visible, .btn:focus-visible, .step button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hk { display: inline-flex; gap: 4px; align-items: center; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--edge); background: var(--field); cursor: pointer; min-height: 32px; color: var(--fg); font: inherit; }
.hk kbd { font: 600 11.5px inherit; padding: 2px 7px; border-radius: 5px; background: var(--panel2); border: 1px solid var(--edge); border-bottom-width: 2px; color: var(--fg); }
.hk.rec { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hk.rec::before { content: "Press keys…"; font-size: 12px; color: var(--accent); padding: 0 4px; }
.hk.rec kbd { display: none; }
.hk .none { font-size: 12px; color: var(--fg2); padding: 0 4px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--edge); border-radius: 8px; background: var(--field); height: 32px; }
.step button { width: 30px; height: 30px; border: 0; background: none; color: var(--fg); cursor: pointer; font-size: 16px; }
.step span { min-width: 38px; text-align: center; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.field { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 10px; border-radius: 8px; border: 1px solid var(--edge); background: var(--field); font-size: 12.5px; min-width: 0; }
.field span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--edge); background: var(--panel2); color: var(--fg); font: 600 12px inherit; cursor: pointer; }
.seg { display: inline-flex; background: var(--field); border: 1px solid var(--edge); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; color: var(--fg2); font: 600 12px inherit; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px #0003; }
.div { height: 1px; background: var(--edge); margin: 4px 0; }
.link { color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; }
.close { width: 28px; height: 28px; border-radius: 7px; border: 0; background: none; color: var(--fg2); cursor: pointer; display: grid; place-items: center; }
.close:hover { background: var(--hover); }
.close svg { width: 14px; height: 14px; }

/* layouts */
.L1 .pop { position: absolute; right: 14px; top: 86px; width: 330px; border-radius: 14px; padding: 8px 14px 12px; }
.L1 .pop::before { content: ""; position: absolute; top: -6px; right: 12px; width: 12px; height: 12px; transform: rotate(45deg); background: var(--panel); border-left: 1px solid var(--edge); border-top: 1px solid var(--edge); }
.L2 .side { position: absolute; top: 32px; right: 0; bottom: 0; width: 380px; border-radius: 0; border-width: 0 0 0 1px; padding: 18px 20px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.L3 .full { position: absolute; inset: 32px 0 0 0; display: flex; border: 0; box-shadow: none; }
.L3 .nav { width: 210px; padding: 14px 10px; background: var(--panel2); border-right: 1px solid var(--edge); display: flex; flex-direction: column; gap: 2px; }
.L3 .nav a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 7px; font-size: 13px; color: var(--fg); cursor: pointer; position: relative; }
.L3 .nav a svg { width: 16px; height: 16px; color: var(--fg2); }
.L3 .nav a.on { background: var(--hover); font-weight: 600; }
.L3 .nav a.on::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent); }
.L3 .main { flex: 1; padding: 22px 30px; overflow: auto; }
.L3 .main h3 { margin: 0 0 14px; font: 700 22px/1.2 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.L4 .cards { position: absolute; inset: 32px 0 0 0; overflow: auto; padding: 22px 60px; background: var(--bg); }
.L4 .cards h3 { margin: 0 0 4px; font: 700 22px "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.L4 .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 4px 16px; margin: 4px 0; }
.L4 .grp { margin: 18px 0 6px; font-weight: 600; font-size: 13px; }
.L5 .tabsheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -48%); width: 560px; border-radius: 14px; overflow: hidden; }
.L5 .tabs { display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--edge); align-items: end; }
.L5 .tabs button { border: 0; background: none; color: var(--fg2); font: 600 13px inherit; padding: 8px 12px 10px; cursor: pointer; position: relative; }
.L5 .tabs button.on { color: var(--fg); }
.L5 .tabs button.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.L5 .tabbody { padding: 10px 18px 16px; min-height: 270px; }
.L6 .bottom { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); width: 600px; border-radius: 16px; padding: 14px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 26px; }
.L6 .bottom .full { grid-column: 1 / -1; }
.L7 .palette { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); width: 520px; border-radius: 14px; overflow: hidden; }
.L7 .search { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--edge); font-size: 14px; }
.L7 .search svg { width: 18px; height: 18px; color: var(--fg2); }
.L7 .search input { flex: 1; border: 0; background: none; color: var(--fg); font: inherit; outline: none; }
.L7 .list { padding: 6px 8px 10px; max-height: 330px; overflow: auto; }
.L7 .list .set { padding: 2px 8px; border-radius: 8px; }
.L7 .list .set.hi { background: var(--hover); }
.L7 .list .cap { padding: 8px 8px 2px; }
.L8 .tiles { position: absolute; inset: 32px 0 0 0; padding: 20px 26px; overflow: auto; background: var(--bg); }
.L8 .tiles h3 { margin: 0 0 14px; font: 700 22px "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.L8 .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.L8 .tile { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 118px; cursor: pointer; transition: border-color .15s; }
.L8 .tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.L8 .tile .top { display: flex; justify-content: space-between; align-items: start; }
.L8 .tile b { font-size: 13.5px; }
.L8 .tile small { color: var(--fg2); font-size: 12px; line-height: 1.35; }
.L8 .tile.wide { grid-column: span 3; flex-direction: row; align-items: center; min-height: 0; }
.L8 .tile.wide .set { flex: 1; }
.L9 .quick { position: absolute; right: 14px; top: 86px; width: 300px; border-radius: 14px; padding: 12px; }
.L9 .qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.L9 .q { border-radius: 10px; padding: 10px; background: var(--field); border: 1px solid var(--edge); cursor: pointer; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; font-weight: 600; transition: background .15s; }
.L9 .q svg { width: 18px; height: 18px; }
.L9 .q.on { background: var(--accent); color: #fff; border-color: transparent; }
.L9 .q small { font-weight: 400; opacity: .8; font-size: 11.5px; }
.L9 .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 0 2px; }
.L10 .dockx { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: 600px; border-radius: 16px; overflow: hidden; }
.L10 .dockx .panel { padding: 14px 18px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 26px; border-bottom: 1px solid var(--edge); }
.L10 .dockx .row { height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 14px; }
.L10 .dockx .row span { width: 18px; height: 18px; border-radius: 5px; background: var(--fg2); opacity: .5; }
.L10 .dockx .row span.c { border-radius: 50%; opacity: 1; }
.L10 .dockx .row .gearon { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.L10 .dockx .row .gearon svg { width: 18px; height: 18px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; } }
</style>
</head>
<body>
<header class="page">
  <div><h1>Glint settings: 10 layouts</h1>
  <p>The settings behind the new gear button, in the editor's floating-dock style. Toggles, steppers and the hotkey fields work: click a hotkey and press keys to record one. Switch light and dark at the right.</p></div>
  <div class="themes" role="group" aria-label="Theme"><button class="on" data-t="dark">Dark</button><button data-t="light">Light</button></div>
</header>
<nav class="jump" aria-label="Layouts"></nav>
<main id="looks"></main>
<script>
const P = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  copy: '<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 00-1.5-1.5H6A1.5 1.5 0 004.5 6v8A1.5 1.5 0 006 15.5h2.5"/>',
  save: '<path d="M5.5 4h10l3 3v12.5a.5.5 0 01-.5.5H6a.5.5 0 01-.5-.5zM8.5 4v4.5h6V4M8.5 20v-6h7v6"/>',
  release: '<path d="M6 3.5l12.5 7.2-5.6 1.6-2.6 5.4z"/>',
  sound: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/>',
  frame: '<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/>',
  timer: '<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4.5l2.5 1.5M9.5 2.5h5"/>',
  folder: '<path d="M3.5 7a2 2 0 012-2h4l2 2h7a2 2 0 012 2v8.5a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/>',
  keyb: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h1M10 10h1M13.5 10h1M17 10h.5M7.5 14h9"/>',
  prt: '<rect x="3.5" y="6.5" width="17" height="11" rx="2"/><path d="M7 10.5h2M11 10.5h2M15 10.5h2M8 14h8"/>',
  boot: '<path d="M12 3v9M6.3 6.3a8 8 0 1011.4 0"/>',
  hdr: '<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M7 9.5v5M10 9.5v5M7 12h3M13 9.5v5h1.5a2.5 2.5 0 000-5zM18 14.5v-5h1"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
};
const ic = (n, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const S = {
  release: ['release', 'Snip when you let go', 'Off: adjust the box, then press Enter', 'tg', true],
  sound: ['sound', 'Capture sound', 'A camera shutter when a snip is taken', 'tg', true],
  frame: ['frame', 'Flash a frame', 'Briefly outline the snipped area', 'tg', true],
  preview: ['timer', 'Preview card', 'Seconds the card stays in the corner', 'step', 6],
  folder: ['folder', 'Save folder', 'Where Save puts pictures', 'folder', 'C:\\Users\\Max\\Pictures\\Glint'],
  hkSnip: ['keyb', 'Snip', 'Open the snip overlay', 'hk', ['Win', 'Shift', 'S']],
  hkFull: ['keyb', 'Full screen', 'Snip the screen under the cursor', 'hk', []],
  hkRepeat: ['keyb', 'Repeat last area', 'Snip the same area again', 'hk', []],
  prt: ['prt', 'Print Screen key', 'Use the Print Screen key for snips', 'tg', false],
  boot: ['boot', 'Start with Windows', 'Glint waits in the tray, about 2 MB', 'tg', true],
  hdr: ['hdr', 'HDR capture', 'Tone-map HDR screens (games, video)', 'tg', false],
};
function ctrl(kind, v) {
  if (kind === 'tg') return `<button class="tg${v ? ' on' : ''}" role="switch" aria-checked="${v}"></button>`;
  if (kind === 'step') return `<span class="step"><button aria-label="Less">−</button><span>${v} s</span><button aria-label="More">+</button></span>`;
  if (kind === 'folder') return `<span class="field" style="max-width:230px"><span>${v}</span><button class="btn">Change</button></span>`;
  if (kind === 'hk') return `<button class="hk">${v.length ? v.map(k => `<kbd>${k}</kbd>`).join('') : '<span class="none">Not set</span>'}</button>`;
  return '';
}
const row = (k, o = {}) => { const [i, t, d, kind, v] = S[k]; return `<div class="set">${o.icon === false ? '' : `<span class="ico">${ic(i)}</span>`}<span class="t"><b>${t}</b>${o.desc === false ? '' : `<small>${d}</small>`}</span>${ctrl(kind, v)}</div>`; };
const head = (title) => `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span class="h">${title}</span><button class="close" aria-label="Close">${ic('close', 2)}</button></div>`;
const editor = (gearOn = true) => `<div class="tbar"><i></i>Glint_2026-11-12_16-15-53.png (2524 × 1259)</div><div class="shot">${[40, 78, 116, 154].map(y => `<b style="top:${y}px"></b>`).join('')}</div><div class="pills"><span class="pill">${ic('copy')}Copy</span><span class="pill save">${ic('save')}Save</span><span class="pill gear${gearOn ? ' on' : ''}">${ic('gear')}</span></div><div class="dock">${'<span></span>'.repeat(10)}${['#ff3b30', '#ffcc00', '#34c759', '#0a84ff'].map(c => `<span class="c" style="background:${c}"></span>`).join('')}</div>`;
const GROUPS = { Capture: ['release', 'prt', 'hdr'], Feedback: ['sound', 'frame', 'preview'], Hotkeys: ['hkSnip', 'hkFull', 'hkRepeat'], Saving: ['folder'], System: ['boot'] };
const NAVI = { Capture: 'release', Feedback: 'sound', Hotkeys: 'keyb', Saving: 'folder', System: 'boot' };

const LAYOUTS = [
  { t: 'Popover from the gear', pts: ['A card drops from the gear with a little pointer; the editor stays visible.', 'Only the six most used settings, no descriptions.', '"All settings" at the bottom for the rest.', 'Fast for quick toggles; tight for hotkeys.'],
    html: () => `${editor()}<div class="sheet pop">${['release', 'sound', 'frame', 'hkSnip'].map(k => row(k, { desc: false })).join('')}<div class="set"><span class="ico">${ic('timer')}</span><span class="t"><b>Preview card</b></span>${ctrl('step', 6)}</div><div class="div"></div><div style="display:flex;justify-content:space-between;align-items:center;padding-top:6px"><span class="link">All settings</span><span style="font-size:12px;color:var(--fg2)">Glint 0.3.0</span></div></div>` },
  { t: 'Side sheet', pts: ['Slides in from the right edge over the editor, full height.', 'Everything in one scroll, grouped with small headings.', 'The picture stays visible on the left.', 'Familiar from Windows 11 flyouts.'],
    html: () => `${editor()}<div class="sheet side">${head('Settings')}${Object.entries(GROUPS).map(([g, ks]) => `<div class="cap" style="margin-top:10px">${g}</div>${ks.map(k => row(k)).join('')}`).join('')}</div>` },
  { t: 'Full window with sections', pts: ['A real settings window: section list on the left, content on the right.', 'Like Windows 11 Settings; room for more settings later.', 'Opens over the editor or as its own window.', 'Most structured; one more click to reach a setting.'],
    html: () => `<div class="tbar"><i></i>Glint settings</div><div class="sheet full"><div class="nav">${Object.keys(GROUPS).map((g, i) => `<a class="${i === 0 ? 'on' : ''}" data-sec="${g}">${ic(NAVI[g])}${g}</a>`).join('')}<a style="margin-top:auto">${ic('info')}About</a></div><div class="main"><h3>Capture</h3>${GROUPS.Capture.map(k => row(k)).join('<div class="div"></div>')}<div class="cap" style="margin-top:22px">Feedback</div>${GROUPS.Feedback.map(k => row(k)).join('<div class="div"></div>')}</div></div>` },
  { t: 'One page of cards', pts: ['A single scrolling page; each setting is its own card, like the Windows 11 Settings app.', 'Group titles between the cards.', 'Very clear and scannable; long page.', 'Replaces the editor view while open (back arrow at the top).'],
    html: () => `<div class="tbar"><i></i>Glint settings</div><div class="cards"><h3>Settings</h3>${Object.entries(GROUPS).map(([g, ks]) => `<div class="grp">${g}</div>${ks.map(k => `<div class="card">${row(k)}</div>`).join('')}`).join('')}</div>` },
  { t: 'Tabbed dialog', pts: ['A centred dialog over the dimmed editor.', 'Tabs: General, Hotkeys, Saving, About.', 'Each tab is short, no scrolling.', 'Classic and compact.'],
    html: () => `${editor()}<div class="scrim"></div><div class="sheet tabsheet"><div class="tabs"><button class="on">General</button><button>Hotkeys</button><button>Saving</button><button>About</button><span style="flex:1"></span><button class="close" aria-label="Close" style="margin-bottom:6px">${ic('close', 2)}</button></div><div class="tabbody">${['release', 'sound', 'frame', 'preview', 'prt', 'boot'].map(k => row(k)).join('')}</div></div>` },
  { t: 'Sheet above the dock', pts: ['Rises from the dock at the bottom, in two columns.', 'Feels part of the dock rather than a separate window.', 'Hotkeys and folder span the full width.', 'The top of the picture stays visible.'],
    html: () => `${editor()}<div class="sheet bottom"><div class="full">${head('Settings')}</div>${['release', 'sound', 'frame', 'preview', 'prt', 'boot'].map(k => row(k, { desc: false })).join('')}<div class="full div"></div><div class="full" style="display:flex;gap:18px;flex-wrap:wrap">${row('hkSnip', { desc: false })}${row('hkFull', { desc: false })}</div><div class="full">${row('folder', { desc: false })}</div></div>` },
  { t: 'Search palette', pts: ['A search box first: type "sound" or "hotkey" to jump to it.', 'Results are live settings you can change right in the list.', 'Fast for people who know what they want.', 'Opens with the gear or Ctrl+, .'],
    html: () => `${editor()}<div class="scrim"></div><div class="sheet palette"><div class="search">${ic('search')}<input placeholder="Search settings" value="" aria-label="Search settings"><kbd style="font-size:11px;padding:1px 6px;border:1px solid var(--edge);border-radius:4px;color:var(--fg2)">Esc</kbd></div><div class="list">${Object.entries(GROUPS).map(([g, ks]) => `<div class="cap">${g}</div>${ks.map((k, i) => row(k)).join('')}`).join('')}</div></div>` },
  { t: 'Tiles', pts: ['Each on/off setting is a big tile you click anywhere to switch; purple edge when on.', 'Hotkeys and folder get wide tiles at the bottom.', 'Very touch- and click-friendly, playful.', 'Replaces the editor view while open.'],
    html: () => `<div class="tbar"><i></i>Glint settings</div><div class="tiles"><h3>Settings</h3><div class="grid">${['release', 'sound', 'frame', 'prt', 'boot', 'hdr'].map(k => { const [i, t, d, , v] = S[k]; return `<div class="tile${v ? ' on' : ''}" data-tile><div class="top"><span class="ico" style="width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center">${ic(i)}</span>${ctrl('tg', v)}</div><b>${t}</b><small>${d}</small></div>`; }).join('')}<div class="tile wide">${row('hkSnip')}</div><div class="tile wide">${row('preview')}</div><div class="tile wide">${row('folder')}</div></div></div>` },
  { t: 'Quick toggles', pts: ['Like the Windows 11 quick settings: four big toggle buttons in a grid.', 'Hotkey and preview time below; "All settings" link for the rest.', 'The fastest way to switch sound or snip-on-release.', 'Pairs well with #3 or #4 as the full page.'],
    html: () => `${editor()}<div class="sheet quick"><div class="qgrid">${[['release', 'Snip on release', true], ['sound', 'Sound', true], ['frame', 'Frame flash', true], ['prt', 'Print Screen', false]].map(([i, t, on]) => `<div class="q${on ? ' on' : ''}" data-q>${ic(i)}<span>${t}<br><small>${on ? 'On' : 'Off'}</small></span></div>`).join('')}</div><div style="margin-top:10px">${row('hkSnip', { desc: false, icon: false })}${row('preview', { desc: false, icon: false })}</div><div class="foot"><span class="link">All settings</span><span style="font-size:12px;color:var(--fg2)">0.3.0</span></div></div>` },
  { t: 'Dock grows into settings', pts: ['The gear sits at the end of the dock; clicking it grows the dock upward into a settings panel.', 'One object, no new window: the tools row stays at the bottom.', 'Two columns, short labels.', 'Most "built-in" feeling; less room for long settings.'],
    html: () => `<div class="tbar"><i></i>Glint_2026-11-12_16-15-53.png (2524 × 1259)</div><div class="shot" style="top:34%">${[40, 78, 116, 154].map(y => `<b style="top:${y}px"></b>`).join('')}</div><div class="pills" style="top:44px"><span class="pill">${ic('copy')}Copy</span><span class="pill save">${ic('save')}Save</span></div><div class="sheet dockx"><div class="panel">${['release', 'sound', 'frame', 'preview', 'prt', 'boot', 'hkSnip', 'hkFull'].map(k => row(k, { desc: false })).join('')}</div><div class="row">${'<span></span>'.repeat(10)}${['#ff3b30', '#ffcc00', '#34c759', '#0a84ff'].map(c => `<span class="c" style="background:${c}"></span>`).join('')}<span class="gearon">${ic('gear')}</span></div></div>` },
];

const main = document.getElementById('looks'), nav = document.querySelector('nav.jump');
LAYOUTS.forEach((L, i) => {
  const n = i + 1;
  nav.insertAdjacentHTML('beforeend', `<a href="#s-${n}">${n}. ${L.t}</a>`);
  main.insertAdjacentHTML('beforeend', `<section class="look" id="s-${n}"><div class="win L${n}">${L.html()}</div><div class="about"><span class="num">${String(n).padStart(2, '0')}</span><h2>${L.t}</h2><ul>${L.pts.map(p => `<li>${p}</li>`).join('')}</ul></div></section>`);
});

document.addEventListener('click', e => {
  const tg = e.target.closest('.tg');
  if (tg) { e.stopPropagation(); tg.classList.toggle('on'); tg.setAttribute('aria-checked', tg.classList.contains('on')); const tile = tg.closest('[data-tile]'); if (tile) tile.classList.toggle('on', tg.classList.contains('on')); return; }
  const tile = e.target.closest('[data-tile]');
  if (tile && !e.target.closest('.hk,.step,.field')) { const t = tile.querySelector('.tg'); if (t) { t.classList.toggle('on'); tile.classList.toggle('on', t.classList.contains('on')); } return; }
  const q = e.target.closest('[data-q]');
  if (q) { q.classList.toggle('on'); q.querySelector('small').textContent = q.classList.contains('on') ? 'On' : 'Off'; return; }
  const st = e.target.closest('.step button');
  if (st) { const sp = st.parentElement.querySelector('span'); let v = parseInt(sp.textContent); v = Math.max(1, Math.min(30, v + (st.textContent === '+' ? 1 : -1))); sp.textContent = v + ' s'; return; }
  const hk = e.target.closest('.hk');
  document.querySelectorAll('.hk.rec').forEach(h => h !== hk && h.classList.remove('rec'));
  if (hk) { hk.classList.add('rec'); hk.focus(); return; }
  const tab = e.target.closest('.tabs button:not(.close)');
  if (tab) { tab.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on')); tab.classList.add('on'); return; }
  const sec = e.target.closest('.nav a');
  if (sec) { sec.parentElement.querySelectorAll('a').forEach(a => a.classList.remove('on')); sec.classList.add('on'); }
  const th = e.target.closest('.themes button');
  if (th) { document.documentElement.dataset.theme = th.dataset.t; th.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === th)); }
});
document.addEventListener('keydown', e => {
  const hk = document.querySelector('.hk.rec');
  if (!hk) return;
  e.preventDefault();
  if (e.key === 'Escape') { hk.classList.remove('rec'); return; }
  const mods = []; if (e.metaKey || e.key === 'Meta') mods.push('Win'); if (e.ctrlKey) mods.push('Ctrl'); if (e.altKey) mods.push('Alt'); if (e.shiftKey) mods.push('Shift');
  if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;
  const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  hk.innerHTML = [...mods, k].map(x => `<kbd>${x}</kbd>`).join(''); hk.classList.remove('rec');
});
</script>
